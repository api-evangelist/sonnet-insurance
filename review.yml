actions:
  apisYmlUpdated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    Sonnet Insurance exposes no public, documented API. apis[] is therefore
    empty and the openapi/ directory is omitted. Recording the absence
    accurately is the finding: a Canadian direct-to-consumer carrier with no
    broker channel, no ACORD footprint, no developer portal and no
    machine-readable surface, in a market with no open-insurance mandate.
