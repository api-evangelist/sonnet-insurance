  acordPosture: no ACORD reference found
  acordEvidence: |
    Zero matches for ACORD, AL3, ACORD XML, NGDS, IVANS, Applied Epic,
    Vertafore or AMS360 across the fetched homepage, get-a-quote page and
    account login page markup, and no such page appears anywhere in the
    published sitemap. Sonnet has no broker or agency distribution channel, so
    no ACORD agency-download or ACORD XML transport applies to it by design.
  insuranceVerbs:
    quote:
      exposedAsAPI: false
      audience: consumer
      note: Performed online at www.sonnet.ca/get-a-quote through Sonnet's own
        web application only.
    bind:
      exposedAsAPI: false
      audience: consumer
      note: Sonnet is notable for allowing full online purchase, including
        through Kanetix.ca, but exposes no bind API.
    issue:
      exposedAsAPI: false
      audience: consumer
      note: Policy documents are issued through the online account; no API.
    fnol:
      exposedAsAPI: false
      audience: consumer
      note: Claims are reported online or by phone; no FNOL API, no ACORD claim
        message, no partner claims feed.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: No public REST API is documented. No api.sonnet.ca host exists.
  - protocol: GraphQL
    scheme: https
    documented: false
    note: https://www.sonnet.ca/graphql returns HTTP 404. No GraphQL surface
      found; nothing to introspect.
  - protocol: gRPC
    documented: false
    note: No .proto files published.
  - protocol: SOAP
    documented: false
    note: No SOAP or ACORD XML web-service endpoint published.
  - protocol: EDI
    documented: false
    note: No AL3 or IVANS agency-download transport -- Sonnet has no broker
      channel for one to serve.
  - protocol: WebSocket
    scheme: wss
    documented: false
  authModel:
    scheme: none-public
    note: No public API authentication scheme is documented -- there is no
      public API. The only authenticated surface is consumer policyholder
      login at /account-log-in (username and password web session). No OAuth2,
      no API keys, no mTLS, no partner SAML federation is published.
      /.well-known/openid-configuration and
      /.well-known/oauth-authorization-server both return HTTP 404.
  webhooks:
    published: false
    asyncapi: false
    note: No event catalog, webhook documentation or AsyncAPI document exists.
  postman:
    published: false
    note: No public Postman collection or workspace found.
  sdks:
    published: false
    note: No SDKs, no CLI, no GitHub organization.
  specs:
    harvested: 0
    note: No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto artifact was
      found, so the openapi/ directory is omitted entirely. Nothing was
      fabricated.
  regulatory:
    prudential: OSFI (federal)
    marketConduct: Provincial -- FSRA (Ontario), AMF (Quebec); Sonnet links the
      AMF register of authorized firms from its Quebec-facing pages.
    openInsuranceMandate: none
    note: Canada has no open-insurance mandate, and Consumer-Driven Banking
      excludes insurance entirely. There is no forcing function requiring
      Sonnet to expose an API.
