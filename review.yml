aid: sonnet-insurance
name: Sonnet Insurance
review:
  question: Does Sonnet Insurance publish a public, self-serve developer portal or
    any documented API for quote, bind, issue, or FNOL?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: insurtech-dtc
  gated: true
findings:
  summary: |
    Sonnet Insurance publishes no public API surface of any kind. Sonnet is a
    Canadian direct-to-consumer property and casualty insurer (a Definity
    Financial company, launched 2016) that underwrites its own auto, home,
    condo, tenant, landlord and pet policies and sells them exclusively
    through sonnet.ca.

    No first-party developer surface exists. Every candidate developer
    subdomain -- developer.sonnet.ca, developers.sonnet.ca, docs.sonnet.ca,
    api.sonnet.ca -- fails to resolve in DNS (no A record, connection never
    established). Every candidate first-party path -- /developers, /developer,
    /api, /partners, /integrations -- returns HTTP 404 from www.sonnet.ca.
    There is no login wall to classify and no marketing "innovation" developer
    page: the surface is simply absent.

    No downloadable machine-readable specification was found. /openapi.json,
    /swagger.json, /api-docs, /graphql and /api/v1 all return HTTP 404. The
    homepage, the get-a-quote flow and the account login page were fetched and
    inspected: the markup contains no reference to swagger, openapi, graphql,
    or any api./auth./identity host. The consumer quote-and-buy flow is a
    first-party application served from www.sonnet.ca (fronted by Imperva
    Incapsula) with no separately addressable public API host. Zero specs were
    harvested; the openapi/ directory is intentionally omitted.

    ACORD posture: no ACORD reference found. Searches of the site markup for
    ACORD, AL3, ACORD XML, NGDS, IVANS, Applied Epic, Vertafore and AMS360
    returned zero matches. This is structurally consistent rather than an
    oversight -- Sonnet has no broker or agency channel at all, so the ACORD
    agency-download rails that carry integration for broker-distributed
    Canadian carriers have nothing to attach to here. Sonnet's own FAQ states:
    "A third party - even a licensed broker - cannot purchase a Sonnet policy
    on your behalf" and "Sonnet is a direct writer - this means our insurance
    can only be purchased from sonnet.ca and it's not available for brokers,
    dealerships (or anybody else) to sell to you."

    Quote / bind / issue / FNOL: Sonnet genuinely performs all four -- quote,
    bind, issue and first notice of loss are all available online to
    consumers -- but exclusively through its own web application. None of the
    four is exposed as a documented API to any audience: not consumer, not
    agent, not partner.

    The only third-party integrations Sonnet describes are commercial rather
    than technical. Sonnet was announced as the first Kanetix.ca (now
    RATESDOTCA) partner letting comparison-site users not just quote but buy
    home and auto insurance online; the announcement contains no API, data
    feed, ACORD or real-time quoting detail. Sonnet Connect (launched April
    2019) aggregates roughly fourteen partner brands -- Homewise, Petsecure,
    Car Loans Canada, Borrowell, KOHO, Mylo, Wealthsimple among them -- and is
    a referral and offer-aggregation program with no described technical
    integration. The /partnerships page is a group and affinity insurance
    landing page for employers and associations with no developer content.

    Market context: this posture is the Canadian norm rather than an outlier.
    OSFI supervises federally-regulated insurers prudentially while the
    provinces regulate market conduct (FSRA in Ontario, AMF in Quebec -- Sonnet
    links the AMF register of authorized firms in its Quebec footer). There is
    no open-insurance mandate in Canada, and Consumer-Driven Banking, Canada's
    open-banking framework, excludes insurance entirely. Nothing compels
    Sonnet to expose an API, and it does not.
