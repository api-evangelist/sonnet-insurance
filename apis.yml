name: Sonnet Insurance
kind: company
description: Sonnet Insurance is a Canadian direct-to-consumer digital property and
  casualty insurer launched in 2016 and a member of the Definity family of companies,
  underwriting its own auto, home, condo, tenant, landlord and pet policies through
  Sonnet Insurance Company. It sells auto, home, condo, tenant and landlord coverage
  in Ontario, Quebec, New Brunswick, Nova Scotia and Prince Edward Island, and home-only
  coverage in British Columbia and Alberta, positioning itself as "Canada's original
  digital-first home and auto insurance company" with a fully online quote-and-buy
  flow and licensed agents for support. Sonnet is an explicit direct writer -- its
  own FAQ states that "a third party -- even a licensed broker -- cannot purchase
  a Sonnet policy on your behalf" -- so it operates no broker or agency distribution
  channel and therefore no ACORD/AL3 agency-download path. Its API posture is closed
  -- no developer, developers, docs or api subdomain resolves in DNS, every first-party
  developer path probed returns HTTP 404, and no OpenAPI, Swagger, GraphQL, Postman
  collection, webhook catalog or partner technical onboarding surface is published.
  The only third-party integrations Sonnet describes -- the Kanetix.ca (RATESDOTCA)
  quote-and-buy partnership and the Sonnet Connect brand referral program -- are
  privately negotiated commercial arrangements with no public technical documentation.
  Two machine-readable surfaces do exist and are captured here. Sonnet serves a real
  llms.txt at www.sonnet.ca/llms.txt that declares per-agent AI-Training, AI-Generation,
  AI-Summarization and AI-Crawling directives (Allow for OpenAI, Google-DeepMind and
  Anthropic) alongside a curated reference-content index -- an AI consent signal rather
  than an API contract. And the secure.sonnet.ca quote-and-buy application is driven by an
  undocumented first-party REST/JSON surface under /api/v1 covering quoting, binding,
  policy servicing, payments and identity; it is observable from Sonnet's own public
  JavaScript bundle but carries no documentation, no specification and no third-party
  terms of use, so it is recorded as observed evidence, not as an integratable API.
